<style>

body.night{--bg:#100d27;--card:#1b1640;--ink:#f3e4c3;--line:#7366b5;--mut:#a79ed0;--btn:#eaa21a;--btnink:#2a1a10;--shadow:#000;--tag:#2a2358;--field:#0b0920}

#app{min-height:100dvh;padding:calc(max(16px,env(safe-area-inset-top)) + 30px) 18px max(22px,env(safe-area-inset-bottom));max-width:520px;margin:0 auto;display:flex;flex-direction:column}
h1,h2,.banner,.code,.timer,.lot-cap,.lot-num,.rolechip{font-family:'Rye',Georgia,'Times New Roman',serif;font-weight:400}
h1{font-size:60px;line-height:1;letter-spacing:4px;margin:10px 0 2px;text-align:center;text-shadow:3px 3px 0 var(--btn)}
h2{font-size:25px;line-height:1.15;margin:8px 0 12px;text-align:center}
h2:after{content:"";display:block;height:14px;width:150px;margin:8px auto 0;background:url(data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHdpZHRoPScyOCcgaGVpZ2h0PScxMic+PHJlY3Qgd2lkdGg9JzI4JyBoZWlnaHQ9JzEyJyBmaWxsPScjZmJmMWQ2Jy8+PHBhdGggZD0nTTE0IDFMMjQgNiAxNCAxMSA0IDZ6JyBmaWxsPScjMWY0ZThjJy8+PHBhdGggZD0nTTE0IDMuOEwxOCA2IDE0IDguMiAxMCA2eicgZmlsbD0nI2VhYTIxYScvPjwvc3ZnPg==) repeat-x;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
h3{margin:20px 0 8px;font:800 14px/1 'Alegreya Sans',sans-serif;color:var(--mut);text-transform:uppercase;letter-spacing:.16em}
p{margin:8px 0}
.mut{color:var(--mut)}.center{text-align:center}.grow{flex:1}
label{display:block;font:800 13px 'Alegreya Sans',sans-serif;color:var(--mut);margin:14px 0 5px;text-transform:uppercase;letter-spacing:.14em}
input,select{width:100%;padding:12px 14px;border:3px solid var(--ink);border-radius:4px;background:var(--field);color:var(--ink);font:700 21px 'Alegreya Sans',sans-serif;user-select:text;-webkit-user-select:text;box-shadow:inset 2px 3px 0 rgba(0,0,0,.12)}
input:focus,select:focus{outline:none;border-color:var(--btn);box-shadow:inset 2px 3px 0 rgba(0,0,0,.12),0 0 0 3px var(--acc)}
.btn{display:block;width:100%;padding:14px 16px;margin:12px 0;border:3px solid var(--ink);border-radius:6px;background:var(--btn);color:var(--btnink);font:800 20px 'Alegreya Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;box-shadow:4px 5px 0 var(--shadow);cursor:pointer;transition:transform .06s,box-shadow .06s}
.btn:active{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--shadow)}
.btn.sec{background:var(--card);color:var(--ink)}
.btn.red{background:var(--red);color:#fff3d9}
.btn.small{padding:9px;font-size:16px;margin:6px 0;box-shadow:3px 3px 0 var(--shadow)}
.btn:disabled{opacity:.45;box-shadow:2px 2px 0 var(--shadow)}
.link{background:none;border:0;color:var(--blue);font:800 17px 'Alegreya Sans',sans-serif;text-decoration:underline;text-underline-offset:4px;padding:10px;width:100%;cursor:pointer}
body.night .link{color:var(--acc)}
.err{background:#f5d3cc;border:2px solid var(--red);color:#5b0d14;padding:10px 14px;border-radius:4px;margin:10px 0;font-weight:700}
.gear{position:fixed;top:calc(max(0px,env(safe-area-inset-top)) + 40px);right:12px;z-index:20;width:46px;height:46px;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink);border-radius:6px;background:var(--card);color:var(--ink);font-size:22px;box-shadow:3px 3px 0 var(--shadow);cursor:pointer}
.code{display:block;width:max-content;margin:10px auto;padding:2px 14px 2px 26px;font-size:62px;letter-spacing:12px;border:3px solid var(--ink);background:var(--card);color:var(--red);box-shadow:5px 6px 0 var(--shadow);transform:rotate(-1.2deg)}
.qr{display:flex;justify-content:center;margin:12px 0}
.qr svg{width:150px;height:150px;background:#fff;border:3px solid var(--ink);padding:6px;box-shadow:4px 4px 0 var(--shadow)}
ul.pl{list-style:none;margin:0;padding:0;counter-reset:p}
ul.pl li{counter-increment:p;display:flex;align-items:center;gap:10px;background:var(--card);border:2px dashed var(--ink);border-radius:4px;padding:10px 12px;margin:8px 0;font:700 21px 'Alegreya Sans',sans-serif}
ul.pl li:before{content:counter(p,decimal-leading-zero);font:400 15px 'Special Elite','Courier New',monospace;color:var(--mut);min-width:22px}
.dot{width:11px;height:11px;border:2px solid var(--ink);background:var(--grn);flex:none;transform:rotate(45deg)}
.dot.off{background:#9a8a72}
.badge{margin-left:auto;font:800 12px 'Alegreya Sans',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--red);border:2px solid var(--red);padding:2px 7px;transform:rotate(-4deg)}
body.night .badge{color:var(--acc);border-color:var(--acc)}
.tag{display:inline-block;font:800 12px 'Alegreya Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border:2px solid var(--ink);background:var(--tag);color:var(--ink)}
.card{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:18px;margin:12px 0;box-shadow:inset 0 0 0 5px var(--card),inset 0 0 0 7px var(--line),4px 5px 0 var(--shadow)}
.rules p{font-size:19px}
.hidden-face{filter:blur(9px);opacity:.55;pointer-events:none}
.tapreveal{cursor:pointer}
.timer{display:block;width:max-content;margin:10px auto;padding:0 22px;font-size:54px;line-height:1.25;font-variant-numeric:tabular-nums;border:3px solid var(--ink);border-radius:8px;background:var(--acc);color:#2a1a10;box-shadow:4px 5px 0 var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:3px;background:var(--tag);padding:3px 10px;font:700 16px 'Alegreya Sans',sans-serif}
.note{font:400 17px/1.35 'Special Elite','Courier New',monospace;background:#fff6dc;color:#2a1a10;border:1px dashed #7b5b44;padding:11px 14px;margin:10px 0;transform:rotate(-.5deg);box-shadow:2px 3px 0 rgba(0,0,0,.28)}
.note:nth-of-type(even){transform:rotate(.6deg)}
.note b{font-family:'Alegreya Sans',sans-serif;font-weight:800}
.dead-note{background:#f6d2cb;border-color:var(--red)}
.lastcall{background:var(--acc);color:#2a1a10;font:800 19px 'Alegreya Sans',sans-serif;text-transform:uppercase;letter-spacing:.04em;text-align:center;border:3px solid var(--ink);padding:12px;margin:10px 0;box-shadow:4px 4px 0 var(--shadow);animation:pulse 1s infinite}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{padding:15px 8px;border:3px solid var(--ink);border-radius:6px;background:var(--card);color:var(--ink);font:800 20px 'Alegreya Sans',sans-serif;box-shadow:3px 4px 0 var(--shadow);cursor:pointer;word-break:break-word;transition:transform .06s}
.pick.sel{background:var(--acc);color:#2a1a10;transform:translate(1px,2px) rotate(-1.5deg);box-shadow:1px 1px 0 var(--shadow)}
.pick.back{display:flex;flex-direction:column;align-items:center;gap:4px;background:repeating-linear-gradient(45deg,var(--blue) 0 7px,#173f78 7px 14px);color:#fbf1d6;border-color:var(--ink)}
.pick.back small{display:block;font-size:13px;font-weight:700}
.pick.back.sel{background:var(--acc);color:#2a1a10}
.tabs{display:flex;gap:6px;margin:10px 0 12px}
.tabs button{flex:1;padding:10px 6px;border:3px solid var(--ink);border-radius:6px;background:var(--card);color:var(--ink);font:800 16px 'Alegreya Sans',sans-serif;text-transform:uppercase;letter-spacing:.06em;box-shadow:2px 3px 0 var(--shadow)}
.tabs button.on{background:var(--acc);color:#2a1a10;transform:translate(1px,2px);box-shadow:none}
.tabs button:disabled{opacity:.7}
/* loteria role card */
.lot-num{position:absolute;top:15px;left:20px;font-size:22px}
.lot-art{flex:1;margin:40px 22px 8px;border:2px solid #2a1a10;border-radius:3px;background:var(--tb);display:flex;align-items:center;justify-content:center}
.lot-art .ic{width:72%;height:72%;color:var(--tf)}
.lot-cap{text-align:center;font-size:21px;text-transform:uppercase;letter-spacing:1px;line-height:1.1;padding:2px 10px 0}
.lot-team{text-align:center;font:700 14px 'Alegreya Sans',sans-serif;color:#7b5b44;padding:2px 0 16px}
.lot-back span{background:#fbf1d6;border:2px solid #2a1a10;padding:9px 14px;font:400 17px/1.15 'Rye',serif;text-align:center;transform:rotate(-2deg);max-width:70%}
.rolechip{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0;padding:8px 12px;font-size:23px;border:3px solid var(--ink);border-radius:6px;background:var(--card);box-shadow:4px 4px 0 var(--shadow)}
.rolechip .ic{width:34px;height:34px}
.rolechip.wolf{color:var(--red)}.rolechip.village{color:var(--turq)}.rolechip.tanner{color:#b99bff}
body.night .rolechip.wolf{color:#ff7d86}
/* night */
.sleep{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;background:
 radial-gradient(1.6px 1.6px at 12% 18%,#fff 50%,transparent),radial-gradient(1.2px 1.2px at 28% 8%,#fff 50%,transparent),radial-gradient(1.8px 1.8px at 47% 22%,#ffe9a8 50%,transparent),radial-gradient(1.2px 1.2px at 63% 12%,#fff 50%,transparent),radial-gradient(1.6px 1.6px at 82% 20%,#fff 50%,transparent),radial-gradient(1.2px 1.2px at 91% 6%,#fff 50%,transparent),radial-gradient(1.2px 1.2px at 8% 42%,#fff 50%,transparent),radial-gradient(1.4px 1.4px at 74% 38%,#fff 50%,transparent),
 linear-gradient(#070618,#17103a 70%,#2a1646)}
.sleep .moon{color:#f3e4c3;filter:drop-shadow(0 0 22px rgba(243,228,195,.35));animation:float 6s ease-in-out infinite}
.sleep .moon .ic{display:block}
.sleep h2{color:#d9c9f2}.sleep h2:after{border-color:#5a4d94;opacity:.6}
.sleep p{color:#8b80c4;max-width:300px}
.sleep ~ .gear{opacity:.25}
.sleep .cacti{position:absolute;left:0;right:0;bottom:0;height:90px;display:flex;justify-content:space-around;align-items:flex-end;color:#05040f;padding-bottom:2px;pointer-events:none}
.sleep .cacti:before{content:"";position:absolute;left:-10%;right:-10%;bottom:-40px;height:70px;border-radius:50% 50% 0 0;background:#05040f}
.sleep .cacti .ic{position:relative}
@keyframes float{50%{transform:translateY(-12px)}}
@keyframes pulse{50%{transform:scale(1.04)}}
.wake{animation:wakein .5s}
@keyframes wakein{from{opacity:.2;transform:scale(.97)}to{opacity:1}}
.eye{display:flex;justify-content:center;color:var(--acc);animation:pulse 1.1s infinite}
.banner{margin:10px 0;padding:14px;text-align:center;font-size:30px;line-height:1.1;border:3px solid var(--ink);box-shadow:5px 6px 0 var(--shadow);transform:rotate(-1deg)}
.banner.win{background:var(--acc);color:#2a1a10}
.banner.lose{background:var(--red);color:#fff3d9}
.banner .ic{width:1em;height:1em}
table{width:100%;border-collapse:collapse;font-size:18px}

/* ================= feedback: vibration / sound / wake lock ================= */
const canVib=typeof navigator.vibrate==='function';
let actx=null;
function unlockAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
document.addEventListener('pointerdown',unlockAudio,{passive:true});
function beep(freq=600,dur=.25){if(!S.snd)return;try{unlockAudio();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=freq;g.gain.value=.08;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+dur)}catch(e){}}
function flash(){const f=$('#flash');if(!f)return;f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}
function buzz(p,force){if(!S.vib&&!force)return;let ok=false;if(canVib){try{ok=navigator.vibrate(p)}catch(e){}}if(!ok&&(Array.isArray(p)&&p.length>1||p>60))flash()}
document.addEventListener('pointerdown',()=>{try{canVib&&navigator.vibrate(0)}catch(e){}},{passive:true});
let wl=null;
async function wakeLock(on){try{if(on&&S.awake&&'wakeLock' in navigator){if(!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}else if(wl){await wl.release();wl=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){setReveal(false)}else if(V&&V.phase!=='lobby')wakeLock(true)});

const CODE_CHARS='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const genCode=()=>Array.from({length:4},()=>CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join('');
function resetNet(){try{conn&&conn.close()}catch(e){}try{peer&&peer.destroy()}catch(e){}peer=null;conn=null;connected=false}
function backHome(err){
  clearTimeout(G&&G.timer);resetNet();isHost=false;G=null;V=null;roomCode='';leaving=false;retries=0;wakeLock(false);
  ui.screen='home';ui.error=err||'';ui.busy=false;ui.sel=[];ui.reveal=false;render();
}
function startHost(attempt=0){
  if(typeof Peer==='undefined'){ui.error=t('netErr');ui.busy=false;render();return}
  resetNet();isHost=true;const code=genCode();
  peer=new Peer(PREFIX+code);
  peer.on('open',()=>{roomCode=code;initGame(code);ui.busy=false;ui.screen='game';render()});
  peer.on('error',e=>{
    if(e.type==='unavailable-id'&&attempt<5)return startHost(attempt+1);
    if(!G){isHost=false;ui.error=t('netErr');ui.busy=false;render()}
  });
  peer.on('connection',c=>{c.on('data',d=>{try{hostRecv(c,d)}catch(err){console.error(err)}});c.on('close',()=>hostDrop(c));c.on('error',()=>hostDrop(c))});
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
}
function joinRoom(code){
  if(typeof Peer==='undefined'){ui.error=t('netErr');ui.busy=false;render();return}
  resetNet();isHost=false;roomCode=code;leaving=false;retries=0;
  peer=new Peer();
  peer.on('open',()=>connectToHost());
  peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
  peer.on('error',e=>{
    if(e.type==='peer-unavailable'){ if(V)return scheduleRetry(); ui.error=t('roomNotFound');ui.busy=false;resetNet();ui.screen='home';render();return}
    if(!V){ui.error=t('netErr');ui.busy=false;resetNet();ui.screen='home';render()}
  });
}
function connectToHost(){
  if(!peer||peer.destroyed)return;
  const c=peer.connect(PREFIX+roomCode,{reliable:true});conn=c;
  c.on('open',()=>{connected=true;retries=0;c.send({t:'join',pid:S.pid,name:S.name,av:S.av});render()});
  c.on('data',d=>onMsg(d));
  c.on('close',()=>{if(conn!==c)return;connected=false;if(!leaving)scheduleRetry();render()});
  c.on('error',()=>{});
}
function scheduleRetry(){
  if(leaving)return;
  if(retries++>=6)return backHome(t('hostLeft'));
  setTimeout(()=>{if(!leaving&&!connected)connectToHost()},2000);render();
}
function sendMsg(m){
  if(isHost)return hostRecv(null,m);
  if(conn&&connected)try{conn.send(m)}catch(e){}
}
function onMsg(m){
  if(m.t==='err'){backHome(t(m.code));return}
  if(m.t==='view')onView(m);
}

/* ================= host: authoritative game ================= */
const clean=s=>String(s||'').replace(/[<>]/g,'').trim().slice(0,14);
const CLASSIC_NIGHT=['wolf','healer','seer'];
const dur=r=>Math.round((G.mode==='classic'?DURC[r]:DUR[r])*SPEED);
const sp=ms=>Math.round(ms*SPEED);
function deckClassic(n){
  const a=[];for(let i=0;i<Math.max(1,Math.round(n/3.5));i++)a.push('wolf');
  a.push('seer');if(n>=5)a.push('healer');if(n>=6)a.push('hunter');
  while(a.length<n)a.push('villager');return a;
}
function initGame(code){
  G={code,phase:'lobby',host:S.pid,mode:'classic',opts:{wolves:null,over:{}},players:[],discuss:300,deck:[],center:[],notes:{},night:null,day:null,vote:null,result:null,timer:null,
     round:1,dawn:null,news:[],verdict:null,shot:null,hunterPending:null};
  addPlayer(S.pid,S.name||'Host',null,S.av);
  ui.screen='game';hostBroadcast();
}
const autoWolves=(n,mode)=>mode==='one'?2:Math.max(1,Math.round(n/3.5));
const wolfCap=(n,mode)=>mode==='one'?Math.max(1,Math.ceil(n/2)):Math.max(1,Math.ceil(n/2)-1);
function autoOn(role,n,mode){
  if(mode==='classic')return role==='seer'||(role==='healer'&&n>=5)||(role==='hunter'&&n>=6);
  return DECK_ORDER.slice(0,n+3).filter(r=>r!=='wolf'&&r!=='villager').includes(role);
}
function cfg(){
  const n=G.players.length,mode=G.mode,cap=wolfCap(n,mode);
  const wolves=Math.min(cap,Math.max(1,G.opts.wolves==null?autoWolves(n,mode):G.opts.wolves));
  const on={};POOL[mode].forEach(r=>on[r]=G.opts.over[r]==null?autoOn(r,n,mode):G.opts.over[r]);
  return {wolves,wolvesAuto:G.opts.wolves==null,cap,pool:POOL[mode],on};
}
function buildDeck(c){
  c=c||cfg();const n=G.players.length,total=G.mode==='classic'?n:n+3;
  const deck=Array(c.wolves).fill('wolf');
  for(const r of c.pool)if(c.on[r]&&deck.length<total)deck.push(r);
  while(deck.length<total)deck.push('villager');
  return deck.sort((a,b)=>ROLE_SORT.indexOf(a)-ROLE_SORT.indexOf(b));
}
function freeAv(want){
  const used=new Set(G.players.map(p=>p.av));
  if(AVATARS.includes(want)&&!used.has(want))return want;
  return AVATARS.find(a=>!used.has(a))||AVATARS[0];
}
function addPlayer(id,name,c,av){
  let base=clean(name)||'Player',n=base,i=2;
  while(G.players.some(p=>p.name===n))n=base+' '+i++;
  G.players.push({id,name:n,av:freeAv(av),conn:c,on:true,alive:true,orig:null,cur:null,ready:false,dayReady:false,vote:null});
}
function setTimer(fn,ms){clearTimeout(G.timer);G.timer=setTimeout(fn,ms)}
const left=t0=>Math.max(0,t0-Date.now());
function viewFor(pid){
  const me=G.players.find(p=>p.id===pid)||{},cl=G.mode==='classic';
  const v={t:'view',phase:G.phase,host:G.host,code:G.code,discuss:G.discuss,mode:G.mode,round:G.round,you:pid,alive:me.alive!==false,
    players:G.players.map(p=>({id:p.id,name:p.name,av:p.av,on:p.on,ready:p.ready,dayReady:p.dayReady,voted:p.vote!=null,alive:p.alive,
      rl:(!p.alive&&G.phase!=='lobby')?p.orig:undefined}))};
  if(G.phase==='lobby'){const c=cfg();c.deck=buildDeck(c);v.cfg=c}
  if(G.phase!=='lobby'){v.role=me.orig;v.deck=G.deck;v.notes=G.notes[pid]||[]}
  if(G.phase==='night'){
    const N=G.night,r=N.role,active=!!r&&me.orig===r&&me.alive!==false;
    v.night={step:N.idx,active,remaining:left(N.endsAt)};
    if(active){
      v.night.role=r;v.night.mine=N.stepNotes[pid]||[];
      if(cl){
        v.night.needs=r==='wolf'?true:!N.acted[pid];
        if(r==='wolf'){v.night.wolves=G.players.filter(p=>p.alive&&p.orig==='wolf').map(p=>p.id);v.night.wolfVotes=N.wolfVotes;v.night.myVote=N.wolfVotes[pid]||null}
      }else{
        const acts=['seer','robber','troublemaker','drunk','wolf'].includes(r);
        const lone=r==='wolf'&&G.players.filter(p=>p.orig==='wolf').length===1;
        v.night.lone=lone;v.night.needs=acts&&!N.acted[pid]&&(r!=='wolf'||lone);
      }
    }
  }
  if(G.phase==='day'){v.remaining=left(G.day.endsAt);v.dawn=G.dawn}
  if(G.phase==='vote'){v.remaining=left(G.vote.endsAt);v.myVote=me.vote;v.vote={cands:G.vote.cands,runoff:G.vote.runoff}}
  if(G.phase==='verdict'){v.remaining=left(G.verdict.endsAt);v.verdict=G.verdict}
  if(G.phase==='shot'){v.remaining=left(G.shot.endsAt);v.shot={id:G.shot.id}}
  if(G.phase==='result')v.result=G.result;
  return v;
}
function hostBroadcast(){
  if(!G)return;
  for(const p of G.players){
    const v=viewFor(p.id);
    if(p.id===S.pid)onView(v);
    else if(p.conn&&p.on){try{p.conn.send(v)}catch(e){}}
  }
}
function hostDrop(c){
  if(!G)return;
  const p=G.players.find(x=>x.conn===c);if(!p)return;
  p.on=false;p.conn=null;
  if(G.phase==='lobby')G.players=G.players.filter(x=>x!==p);
  checkProgress();hostBroadcast();
}
function hostRecv(c,m){
  if(!G)return;
  if(m.t==='join'){
    const old=G.players.find(p=>p.id===m.pid);
    if(old){
      if(old.conn&&old.conn!==c){const oc=old.conn;old.conn=null;try{oc.close()}catch(e){}}
      old.conn=c;old.on=true;c.pid=m.pid;
      if(G.phase==='lobby'&&m.name)old.name=uniqueName(clean(m.name),old.id)||old.name;
      if(G.phase==='lobby'&&AVATARS.includes(m.av)&&!G.players.some(q=>q!==old&&q.av===m.av))old.av=m.av;
    }else{
      if(G.phase!=='lobby'){try{c.send({t:'err',code:'started'})}catch(e){}return}
      if(G.players.length>=MAXP){try{c.send({t:'err',code:'full'})}catch(e){}return}
      c.pid=m.pid;addPlayer(m.pid,m.name,c,m.av);
    }
    hostBroadcast();return;
  }
  const pid=c?c.pid:S.pid;
  const p=G.players.find(x=>x.id===pid);if(!p)return;
  const isH=pid===G.host;
  switch(m.t){
    case 'name':if(G.phase==='lobby'||G.phase==='roles'){const n=uniqueName(clean(m.name),pid);if(n)p.name=n}break;
    case 'discuss':if(isH&&G.phase==='lobby'&&[2,3,5,7,10].includes(m.v))G.discuss=m.v*60;break;
    case 'mode':if(isH&&G.phase==='lobby'&&['classic','one'].includes(m.v)){G.mode=m.v;G.opts={wolves:null,over:{}}}break;
    case 'wolves':if(isH&&G.phase==='lobby')G.opts.wolves=m.v==null?null:Math.max(1,Math.min(cfg().cap,m.v|0));break;
    case 'role':if(isH&&G.phase==='lobby'&&POOL[G.mode].includes(m.r))G.opts.over[m.r]=!!m.on;break;
    case 'avatar':if(G.phase==='lobby'&&AVATARS.includes(m.av)&&!G.players.some(q=>q!==p&&q.av===m.av))p.av=m.av;break;
    case 'start':if(isH&&G.phase==='lobby'&&G.players.length>=MINP)startGame();break;
    case 'ready':if(G.phase==='roles')p.ready=true;break;
    case 'dayready':if(G.phase==='day'&&p.alive)p.dayReady=true;break;
    case 'force':if(isH){if(G.phase==='roles')startNight();else if(G.phase==='day')startVote();else if(G.phase==='vote')resolveVote()}break;
    case 'act':nightAct(p,m);break;
    case 'vote':{const q=G.players.find(x=>x.id===m.target);
      if(G.phase==='vote'&&p.alive&&q&&q.alive&&m.target!==pid&&p.vote==null&&(!G.vote.cands||G.vote.cands.includes(m.target)))p.vote=m.target;break}
    case 'shot':if(G.phase==='shot'&&G.shot.id===pid)resolveShot(m.target);break;
    case 'again':if(isH&&G.phase==='result')resetToLobby();break;
    case 'leave':
      if(G.phase==='lobby'&&!isH)G.players=G.players.filter(x=>x!==p);
      else{p.on=false;p.conn=null}
      break;
  }
  checkProgress();hostBroadcast();
}
function uniqueName(n,pid){if(!n)return '';let b=n,k=n,i=2;while(G.players.some(p=>p.id!==pid&&p.name===k))k=b+' '+i++;return k}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function startGame(){
  const n=G.players.length,cards=shuffle(buildDeck());
  G.center=G.mode==='classic'?[]:cards.slice(n);
  G.players.forEach((p,i)=>{p.orig=p.cur=cards[i];p.ready=false;p.dayReady=false;p.vote=null;p.alive=true});
  G.deck=cards.slice().sort((a,b)=>ROLE_SORT.indexOf(a)-ROLE_SORT.indexOf(b));
  G.notes={};G.result=null;G.round=1;G.dawn=null;G.news=[];G.verdict=null;G.shot=null;G.hunterPending=null;G.phase='roles';
}
function startNight(){
  const base=G.mode==='classic'?CLASSIC_NIGHT:NIGHT_ORDER;
  const order=base.filter(r=>G.deck.includes(r));
  G.phase='night';G.night={order,idx:-1,role:null,acted:{},stepNotes:{},wolfVotes:{},heal:null,endsAt:0};
  G.players.forEach(p=>{p.dayReady=false;p.vote=null});
  nextStep();
}
function addNote(pid,n,persist=true){
  if(persist)(G.notes[pid]=G.notes[pid]||[]).push(n);
  (G.night.stepNotes[pid]=G.night.stepNotes[pid]||[]).push(n);
}
function stepDone(){
  const N=G.night,r=N.role,cl=G.mode==='classic';
  const actors=G.players.filter(p=>p.orig===r&&p.on&&(!cl||p.alive));
  if(!actors.length)return false;
  if(cl)return r==='wolf'?actors.every(p=>N.wolfVotes[p.id]):actors.every(p=>N.acted[p.id]);
  const wolves=G.players.filter(x=>x.orig==='wolf').length;
  if(['seer','robber','troublemaker','drunk'].includes(r)||(r==='wolf'&&wolves===1))return actors.every(p=>N.acted[p.id]);
  return false;
}
function maybeFinishStep(){
  const N=G.night;if(!N||G.phase!=='night'||N.closing||!stepDone())return;
  N.closing=true;const ms=sp(5000);
  if(N.endsAt-Date.now()>ms){N.endsAt=Date.now()+ms;setTimer(nextStep,ms+sp(500))}
}
function nextStep(){
  if(!G||G.phase!=='night')return;
  const N=G.night;N.idx++;
  if(N.idx>=N.order.length){
    if(G.mode==='classic')endNightClassic();else{startDay();hostBroadcast()}
    return;
  }
  const cl=G.mode==='classic';
  const r=N.role=N.order[N.idx];N.acted={};N.stepNotes={};N.closing=false;N.endsAt=Date.now()+dur(r);
  const actors=G.players.filter(p=>p.orig===r&&(!cl||p.alive));
  if(r==='wolf'){actors.forEach(p=>addNote(p.id,actors.length>1?{k:'wolves',ids:actors.map(x=>x.id)}:{k:'wolfAlone'},!cl))}
  if(r==='minion'){const w=G.players.filter(p=>p.orig==='wolf').map(p=>p.id);actors.forEach(p=>addNote(p.id,w.length?{k:'minion',ids:w}:{k:'minionNone'}))}
  if(r==='insomniac')actors.forEach(p=>addNote(p.id,{k:'insomniac',role:p.cur}));
  setTimer(nextStep,dur(r)+sp(800));
  hostBroadcast();
}
function nightAct(p,m){
  const N=G.night;
  if(G.phase!=='night'||!N.role||p.orig!==N.role)return;
  if(G.mode==='classic')return classicAct(p,m);
  if(N.acted[p.id])return;
  const r=N.role,byId=id=>G.players.find(x=>x.id===id),ci=i=>Number.isInteger(i)&&i>=0&&i<3;
  if(m.skip&&['wolf','robber','troublemaker'].includes(r)){addNote(p.id,{k:'skip'});N.acted[p.id]=1;maybeFinishStep();return}
  if(r==='wolf'){
    if(G.players.filter(x=>x.orig==='wolf').length!==1||!ci(m.i))return;
    addNote(p.id,{k:'center',i:m.i,role:G.center[m.i]});
  }else if(r==='seer'){
    if(m.kind==='player'){const q=byId(m.id);if(!q||q===p)return;addNote(p.id,{k:'seerP',id:q.id,role:q.cur})}
    else if(m.kind==='center'&&Array.isArray(m.idxs)&&m.idxs.length===2&&m.idxs[0]!==m.idxs[1]&&m.idxs.every(ci)){
      addNote(p.id,{k:'seerC',a:m.idxs[0],b:m.idxs[1],ra:G.center[m.idxs[0]],rb:G.center[m.idxs[1]]})}
    else return;
  }else if(r==='robber'){
    const q=byId(m.id);if(!q||q===p)return;
    [p.cur,q.cur]=[q.cur,p.cur];addNote(p.id,{k:'robbed',id:q.id,role:p.cur});
  }else if(r==='troublemaker'){
    const a=byId(m.a),b=byId(m.b);if(!a||!b||a===b||a===p||b===p)return;
    [a.cur,b.cur]=[b.cur,a.cur];addNote(p.id,{k:'swapped',a:a.id,b:b.id});
  }else if(r==='drunk'){
    if(!ci(m.i))return;[p.cur,G.center[m.i]]=[G.center[m.i],p.cur];addNote(p.id,{k:'drunk',i:m.i});
  }else return;
  N.acted[p.id]=1;maybeFinishStep();
}
/* ---- classic mode ---- */
function classicAct(p,m){
  const N=G.night,r=N.role;
  if(!p.alive)return;
  const q=G.players.find(x=>x.id===m.target);if(!q||!q.alive)return;
  if(r==='wolf'){if(q.orig==='wolf'||q===p)return;N.wolfVotes[p.id]=q.id;maybeFinishStep();return}
  if(N.acted[p.id])return;
  if(r==='healer'){N.heal=q.id;addNote(p.id,{k:'healed',id:q.id})}
  else if(r==='seer'){if(q===p)return;addNote(p.id,{k:'seerW',id:q.id,wolf:q.orig==='wolf'})}
  else return;
  N.acted[p.id]=1;maybeFinishStep();
}
function kill(id,cause){
  const p=G.players.find(x=>x.id===id);if(!p||!p.alive)return;
  p.alive=false;if(cause!=='vote')G.news.push({id,role:p.orig,cause});
  if(p.orig==='hunter')G.hunterPending=id;
}
function endNightClassic(){
  const N=G.night,tally={};
  G.players.filter(p=>p.alive&&p.orig==='wolf').forEach(w=>{const v=N.wolfVotes[w.id];if(v)tally[v]=(tally[v]||0)+1});
  const max=Math.max(0,...Object.values(tally)),top=Object.keys(tally).filter(k=>tally[k]===max);
  const victim=max?top[Math.floor(Math.random()*top.length)]:null;
  if(victim&&N.heal!==victim)kill(victim,'wolves');
  settle('day');
}
function checkWin(){
  const al=G.players.filter(p=>p.alive),w=al.filter(p=>p.orig==='wolf').length,o=al.length-w;
  const win=w===0?'village':(w>=o?'wolf':null);if(!win)return false;
  G.result={mode:'classic',win:[win],round:G.round,dead:[],hunter:[],tally:{},votes:{},center:[],
    players:G.players.map(p=>({id:p.id,name:p.name,orig:p.orig,cur:p.orig,alive:p.alive,won:(teamOf(p.orig)==='wolf')===(win==='wolf')}))};
  G.phase='result';clearTimeout(G.timer);return true;
}
function settle(next){
  if(G.hunterPending){
    const id=G.hunterPending;G.phase='shot';G.shot={id,next,endsAt:Date.now()+sp(25000)};
    setTimer(()=>resolveShot(null),sp(25000));hostBroadcast();return;
  }
  if(checkWin()){hostBroadcast();return}
  if(next==='day'){startDay()}else{G.round++;startNight();return}
  hostBroadcast();
}
function resolveShot(target){
  if(!G||G.phase!=='shot')return;
  const s=G.shot,q=G.players.find(x=>x.id===target);
  G.hunterPending=null;G.shot=null;
  if(q&&q.alive&&q.id!==s.id)kill(q.id,'shot');
  settle(s.next);
}
function startRunoff(cands){
  G.vote={endsAt:Date.now()+90000,cands,runoff:true};G.players.forEach(p=>p.vote=null);
  setTimer(resolveVote,90000);hostBroadcast();
}
function resolveVoteClassic(){
  const tally={},votes={};
  G.players.filter(p=>p.alive).forEach(p=>{if(p.vote){votes[p.id]=p.vote;tally[p.vote]=(tally[p.vote]||0)+1}});
  const max=Math.max(0,...Object.values(tally)),top=Object.keys(tally).filter(k=>tally[k]===max);
  if(top.length>1&&max>=1&&!G.vote.runoff)return startRunoff(top);
  const out=max>=1&&top.length===1?top[0]:null;
  const role=out?G.players.find(p=>p.id===out).orig:null;
  if(out)kill(out,'vote');
  G.verdict={out,role,tally,votes,endsAt:Date.now()+sp(9000)};
  G.phase='verdict';setTimer(()=>settle('night'),sp(9000));hostBroadcast();
}
/* ---- shared day / vote ---- */
function startDay(){
  G.phase='day';G.day={endsAt:Date.now()+G.discuss*1000};G.players.forEach(p=>{p.dayReady=false;p.vote=null});
  if(G.mode==='classic')G.dawn={round:G.round,events:G.news.splice(0)};
  setTimer(startVote,G.discuss*1000);
}
function startVote(){
  if(G.phase!=='day')return;
  G.phase='vote';G.vote={endsAt:Date.now()+90000,cands:null,runoff:false};G.players.forEach(p=>p.vote=null);
  setTimer(resolveVote,90000);hostBroadcast();
}
function resolveVote(){
  if(!G||G.phase!=='vote')return;
  if(G.mode==='classic')return resolveVoteClassic();
  const tally={},votes={};
  G.players.forEach(p=>{if(p.vote){votes[p.id]=p.vote;tally[p.vote]=(tally[p.vote]||0)+1}});
  const max=Math.max(0,...Object.values(tally)),top=Object.keys(tally).filter(k=>tally[k]===max);
  if(top.length>1&&max>=1&&!G.vote.runoff)return startRunoff(top);
  const dead=new Set(max>=2||(G.vote.runoff&&max>=1)?top:[]);
  const hunter=[];let grew=true;
  while(grew){grew=false;
    for(const id of [...dead]){const p=G.players.find(x=>x.id===id);
      if(p&&p.cur==='hunter'&&votes[id]&&!hunter.some(h=>h.from===id)){hunter.push({from:id,to:votes[id]});if(!dead.has(votes[id])){dead.add(votes[id]);grew=true}}}}
  const P=G.players,wolves=P.filter(p=>p.cur==='wolf'),minions=P.filter(p=>p.cur==='minion');
  const tannerDead=P.some(p=>p.cur==='tanner'&&dead.has(p.id));
  let village,wolf;
  if(wolves.length){const wd=wolves.some(p=>dead.has(p.id));village=wd;wolf=!wd}
  else if(minions.length){const o=P.some(p=>dead.has(p.id)&&p.cur!=='minion');wolf=o&&!tannerDead;village=!o}
  else{village=dead.size===0;wolf=false}
  if(tannerDead&&!wolves.length)village=false;
  if(tannerDead)wolf=false;
  const win=[];if(village)win.push('village');if(wolf)win.push('wolf');if(tannerDead)win.push('tanner');
  G.result={dead:[...dead],hunter,tally,votes,win,center:G.center.slice(),
    players:P.map(p=>({id:p.id,name:p.name,orig:p.orig,cur:p.cur,
      won:p.cur==='tanner'?tannerDead:teamOf(p.cur)==='wolf'?wolf:village}))};
  G.phase='result';clearTimeout(G.timer);hostBroadcast();
}

  clearTimeout(G.timer);G.players=G.players.filter(p=>p.on);
  G.players.forEach(p=>{p.orig=p.cur=null;p.ready=false;p.dayReady=false;p.vote=null;p.alive=true});
  G.phase='lobby';G.notes={};G.night=null;G.result=null;G.deck=[];G.center=[];G.round=1;G.dawn=null;G.news=[];G.verdict=null;G.shot=null;G.hunterPending=null;

  if(!G)return;

const lastOf=v=>{

    return act.length>1&&pend.length===1&&pend[0].id===v.you?'vote'+(v.vote&&v.vote.runoff?'r':''):''}

    const pend=v.night.wolves.filter(id=>!v.night.wolfVotes[id]);return pend.length===1&&pend[0]===v.you?'wolf'+v.night.step:''}

};

  const cl=V.mode==='classic',me=V.players.find(p=>p.id===V.you),hostMe=V.host===V.you;
  const act=V.players.filter(p=>p.on&&(!cl||p.alive)),rdy=act.filter(p=>p.dayReady).length;
  return `<h2 style="margin-top:40px">${ic('aztec-calendar-sun')} ${t('dayTitle')}</h2>${cantor('day')}${cl?dawnHTML():''}<p class="center mut">${t('dayText')}</p>${cd()}
  ${V.alive?'':`<div class="err">${t('youDead')}</div>`}
  <h3>${t('learned')}</h3>${V.notes.length?V.notes.map(n=>`<div class="note">${noteText(n)}</div>`).join(''):`<p class="mut">${t('nothingLearned')}</p>`}
  <h3>${t('yourCard')}</h3>${roleCard(V.role,ui.reveal)}
  <h3>${t('rolesInPlay')}${cl?'':t('rolesInPlayC')}</h3>${rolesInPlay()}${cl?graveHTML():''}
  <div class="grow"></div>
  ${V.alive?`<button class="btn" data-a="dayready" ${me.dayReady?'disabled':''}>${me.dayReady?t('waitingReady',rdy,act.length):ic('vote')+' '+t('readyVote')}</button>`:''}
  ${hostMe?`<button class="btn sec small" data-a="force">${t('voteNow')}</button>`:''}`;
}
function voteHTML(){
  const cands=V.vote&&V.vote.cands;
  const ro=cands?`<div class="note dead-note" style="text-align:center">${t('runoff',cands.map(pname).join(' / '))}</div>`:'';
  const act=V.players.filter(p=>p.on&&p.alive),voted=act.filter(p=>p.voted).length;
  const hostBtn=V.host===V.you?`<button class="btn sec small" data-a="force">${t('voteNow')}</button>`:'';
  const head=`<h2 style="margin-top:40px">${ic('vote')} ${t('voteTitle')}</h2>`;
  if(!V.alive)return `${head}${ro}${cd()}<div class="err">${t('youDead')} ${t('deadVote')}</div><div class="grow"></div>${hostBtn}`;
  if(V.myVote){const q=V.players.find(p=>p.id===V.myVote);return `${head}${ro}${cd()}<div class="tabla one">${pcard(q,{beans:1})}</div><p class="center mut">${t('voted',voted,act.length)}</p><div class="grow"></div>${hostBtn}`}
  const sel=ui.sel[0];
  const list=V.players.filter(p=>p.id!==V.you&&p.alive&&(!cands||cands.includes(p.id)));
  return `${head}${cantor('vote')}${ro}${lastBanner()}<p class="center mut">${t('voteText')}</p>${cd()}
  ${pgrid(list,p=>({attr:pickAttr(p.id),sel:sel===p.id,beans:sel===p.id?1:0,drop:ui.drop===p.id}))}
  <div class="grow"></div><button class="btn red" data-a="castvote" ${sel?'':'disabled'}>${sel?t('voteFor',pname(sel)):t('voteTitle')}</button>`;
}
function verdictHTML(){
  const vd=V.verdict,rows=Object.entries(vd.votes||{});
  const list=V.players.filter(p=>p.alive||p.id===vd.out);
  return `<h2 style="margin-top:40px">${ic('vote')} ${t('verdictTitle')}</h2>${cantor('verdict')}${cd()}
  ${pgrid(list,p=>({beans:vd.tally[p.id]||0,dead:p.id===vd.out}))}
  <div class="card center">${vd.out?`<div class="dead" style="font-size:22px">${ic('skull')} ${t('verdictOut',pname(vd.out),roleLabel(vd.role))}</div>`:t('verdictNone')}</div>
  <table>${rows.map(([a,b])=>`<tr><td>${pname(a)}</td><td class="r">&rarr; <b>${pname(b)}</b></td></tr>`).join('')}</table>`;
}
function shotHTML(){
  if(V.shot.id!==V.you)return `<div class="grow"></div><div class="center">${ri('hunter',96)}<h2>${t('shotTitle')}</h2><p class="mut">${t('shotWait')}</p>${cd()}</div><div class="grow"></div>`;
  const sel=ui.sel[0];
  return `<h2 style="margin-top:40px">${ri('hunter')} ${t('shotTitle')}</h2><p class="center">${t('shotYou')}</p>${cd()}
  ${pgrid(V.players.filter(p=>p.id!==V.you&&p.alive),p=>({attr:pickAttr(p.id),sel:sel===p.id,beans:sel===p.id?1:0,drop:ui.drop===p.id}))}
  <div class="grow"></div><button class="btn red" data-a="shoot" ${sel?'':'disabled'}>${sel?t('shootBtn',pname(sel)):t('shotTitle')}</button>`;
}
function resultHTML(){
  const R=V.result,me=R.players.find(p=>p.id===V.you),hostMe=V.host===V.you,cl=R.mode==='classic';
  const again=hostMe?`<button class="btn" data-a="again">${ic('refresh-cw')} ${t('playAgain')}</button>`:`<p class="center mut">${t('waitAgain')}</p>`;
  const banner=`<div class="banner ${me.won?'win':'lose'} ${ui.fx?'fx':''}">${me.won?t('loteria'):ic('skull')+' '+t('youLost')}</div><p class="center" style="font-size:19px;margin:4px 0">${me.won?t('youWon')+' · ':''}${R.win.map(w=>t('win_'+w)).join(' + ')||''}</p>${me.won?'':cantor('lose')}`;
  const cards=R.players.map((p,k)=>{
    const dead=cl?!p.alive:R.dead.includes(p.id);
    return rcard({role:cl?p.orig:p.cur,name:p.name+(p.id===V.you?' ('+t('you')+')':''),dead,win:p.won,delay:k*.14,
      sub:cl?'':[p.orig!==p.cur?t('was')+' '+esc(cap(p.orig)):'',t('votesN',R.tally[p.id]||0)].filter(Boolean).join(' · ')});
  }).join('');
  let extra='';
  if(!cl){
    extra=`<div class="card center">${R.dead.length?`<span class="dead">${ic('skull')} ${t('died')}: ${R.dead.map(pname).join(', ')}</span>`:t('noDeath')}${R.hunter.map(h=>`<div style="margin-top:6px">${ri('hunter')} ${t('hunterShot',pname(h.from),pname(h.to))}</div>`).join('')}</div>`;
  }
  const center=!cl&&R.center.length?`<h3>${t('center')}</h3><div class="tabla">${R.center.map((r,k)=>rcard({role:r,name:t('centerN',k+1),delay:(R.players.length+k)*.14})).join('')}</div>`:'';
  return `<h2 style="margin-top:40px">${ic('sunrise')} ${t('dawn')}</h2>${banner}${extra}<div class="tabla">${cards}</div>${center}<div class="grow"></div>${again}`;
}
function modalHTML(){
  if(!ui.modal)return '';
  const hasGame=ui.screen==='game'&&V;
  return `<div class="modalbg" data-a="closemodal"><div class="modal" data-stop="1">
  <h2>${ic('settings')} ${t('settings')}</h2>
  <div class="row"><b>${t('language')}</b><div class="seg"><button class="${S.lang==='en'?'on':''}" data-a="lang" data-v="en">English</button><button class="${S.lang==='es'?'on':''}" data-a="lang" data-v="es">Español</button></div></div>
  <div class="row"><b>${t('vibration')}</b><span><button class="seg" style="all:unset;margin-right:10px;color:var(--blue);cursor:pointer" data-a="testvib">${t('test')}</button><label class="sw" style="display:inline-block;margin:0;vertical-align:middle"><input type="checkbox" data-a="tog" data-v="vib" ${S.vib?'checked':''}><i></i></label></span></div>
  ${canVib?'':`<p class="mut" style="font-size:13px">${t('noVib')}</p>`}
  <div class="row"><b>${t('sound')}</b><label class="sw" style="margin:0"><input type="checkbox" data-a="tog" data-v="snd" ${S.snd?'checked':''}><i></i></label></div>
  <div class="row"><b>${t('keepAwake')}</b><label class="sw" style="margin:0"><input type="checkbox" data-a="tog" data-v="awake" ${S.awake?'checked':''}><i></i></label></div>
  <p class="mut" style="font-size:12px;margin:12px 0 0">Icons: Game-icons.net (Lorc, Delapouite &amp; contributors, CC BY 3.0) · Lucide (ISC)</p><button class="btn sec" data-a="showhow">${t('howTo')}</button>
  ${hasGame?`<button class="btn red" data-a="leave">${t('leave')}</button>`:''}
  <button class="btn sec" data-a="closemodal">${t('close')}</button></div></div>`;
}
let rendering=false;
function render(){
  ui.fx=!!ui.fxPending;ui.fxPending=false;
  const el=$('#app'),ae=document.activeElement,fid=ae&&ae.id,ss=ae&&ae.selectionStart;
  document.documentElement.lang=S.lang||'en';
  document.body.classList.toggle('night',!!(V&&ui.screen==='game'&&V.phase==='night'));
  const showGear=ui.screen!=='lang';
  el.innerHTML=(connected===false&&!isHost&&V?`<div class="offline">${t('reconnecting')}</div>`:'')+screenHTML()+(showGear?'<button class="gear" data-a="openmodal" aria-label="settings">'+ic('settings',22)+'</button>':'');
  $('#modal').innerHTML=modalHTML();
  if(fid){const n=document.getElementById(fid);if(n&&n.tagName==='INPUT'){n.focus();try{n.setSelectionRange(ss,ss)}catch(e){}}}
  ui.drop=null;tick();
}
function tick(){
  document.querySelectorAll('[data-cd]').forEach(e=>{e.textContent=fmt(+e.dataset.cd-Date.now())});
  const c=document.getElementById('closing');
  if(c){
    const left=+c.dataset.end-Date.now();
    if(left<=5000*SPEED&&left>-300){
      c.hidden=false;const n=Math.max(1,Math.ceil(left/(1000*SPEED))),b=c.querySelector('.cl-num');
      if(b.textContent!=n)b.textContent=n;
      if(ui.lastN!==n){ui.lastN=n;buzz(80);beep(520,.1)}
    }else{c.hidden=true;ui.lastN=null}
  }
}
setInterval(tick,250);

/* ================= events ================= */
const limit=()=>{if(!V)return 1;if(V.phase==='night'&&V.night.active){const r=V.night.role;return r==='troublemaker'||(r==='seer'&&ui.seerTab==='c')?2:1}return 1};
function setReveal(on){
  ui.reveal=on;clearTimeout(ui._rt);
  document.querySelectorAll('.loteria').forEach(e=>e.classList.toggle('shown',on));
  document.querySelectorAll('.hide-sec').forEach(e=>e.classList.toggle('hidden-face',!on));
  buzz(25);if(on)ui._rt=setTimeout(()=>setReveal(false),12000);
}
const A={
  lang(v){S.lang=v;save();if(ui.screen==='lang')ui.screen='home';ui.error=''},
  home(){ui.screen='home'},
  howto(){ui.howBack='home';ui.screen='howto'},
  showhow(){ui.modal=false;ui.howBack='game';ui.screen='howto'},
  closehow(){ui.screen=V?'game':'home'},
  create(){if(!ui.name.trim()){ui.error=t('needName');return}S.name=clean(ui.name);save();ui.error='';ui.busy=true;startHost()},
  join(){if(!ui.name.trim()){ui.error=t('needName');return}if(ui.joinCode.length!==4){ui.error=t('roomNotFound');return}S.name=clean(ui.name);save();ui.error='';ui.busy=true;joinRoom(ui.joinCode.toUpperCase())},
  openmodal(){ui.modal=true},closemodal(){ui.modal=false},
  tog(v,el){S[v]=el.checked;save();if(v==='awake')wakeLock(V&&V.phase!=='lobby')},
  testvib(){buzz([200,100,200],true);beep(600,.2)},
  leave(){if(!confirm(t('leaveConfirm')))return;ui.modal=false;leaving=true;if(isHost){backHome()}else{sendMsg({t:'leave'});setTimeout(()=>backHome(),50)}},
  share(){const url=location.href.split('#')[0].split('?')[0]+'#'+V.code,text=t('shareText',V.code);
    if(navigator.share)navigator.share({title:'Wolf',text,url}).catch(()=>{});
    else if(navigator.clipboard)navigator.clipboard.writeText(text+' '+url).then(()=>alert(t('copied')),()=>{});return 'noRender'},
  mode(v){sendMsg({t:'mode',v})},
  av(v){if(ui.screen==='game'&&V)sendMsg({t:'avatar',av:v});else{S.av=v;save()}},
  wolfdec(){sendMsg({t:'wolves',v:V.cfg.wolves-1})},
  wolfinc(){sendMsg({t:'wolves',v:V.cfg.wolves+1})},
  wolfauto(){sendMsg({t:'wolves',v:null})},
  roletog(v){sendMsg({t:'role',r:v,on:!V.cfg.on[v]})},
  start(){sendMsg({t:'start'})},
  ready(){sendMsg({t:'ready'});buzz(40)},
  force(){sendMsg({t:'force'})},
  again(){sendMsg({t:'again'})},
  dayready(){sendMsg({t:'dayready'});buzz(40)},
  reveal(){setReveal(!ui.reveal);return 'noRender'},
  seertab(v){ui.seerTab=v;ui.sel=[]},
  pick(v){buzz(20);const i=ui.sel.indexOf(v);if(i>=0)ui.sel.splice(i,1);else{ui.drop=v;ui.sel.push(v);while(ui.sel.length>limit())ui.sel.shift()}},
  skip(){sendMsg({t:'act',skip:true})},
  shoot(){if(ui.sel[0]){sendMsg({t:'shot',target:ui.sel[0]});ui.sel=[];buzz([80,40,160])}},
  confirm(){
    if(V.mode==='classic'){sendMsg({t:'act',target:ui.sel[0]});ui.sel=[];buzz(60);return}
    const r=V.night.role,s=ui.sel,ci=x=>+String(x).slice(1);
    if(r==='seer')sendMsg(ui.seerTab==='c'?{t:'act',kind:'center',idxs:s.map(ci)}:{t:'act',kind:'player',id:s[0]});
    else if(r==='robber')sendMsg({t:'act',id:s[0]});
    else if(r==='troublemaker')sendMsg({t:'act',a:s[0],b:s[1]});
    else sendMsg({t:'act',i:ci(s[0])});
    ui.sel=[];buzz(60);
  },
  castvote(){if(ui.sel[0]){sendMsg({t:'vote',target:ui.sel[0]});buzz([50,40,90]);ui.sel=[]}}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el)return;
  if(el.classList.contains('modalbg')&&e.target!==el)return; // click inside modal
  if(el.type==='checkbox')return; // handled by change
  const f=A[el.dataset.a];if(!f)return;
  if(f(el.dataset.v,el)==='noRender')return;
  render();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.matches('input[type=checkbox][data-a]')){A.tog(el.dataset.v,el);render();return}
  if(el.id==='discussSel')sendMsg({t:'discuss',v:+el.value});
  if(el.id==='lobbyName'||el.id==='roleName'){ui.name=el.value;S.name=clean(el.value);save();sendMsg({t:'name',name:el.value})}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='nameInput'||el.id==='lobbyName'||el.id==='roleName')ui.name=el.value;
  if(el.id==='codeInput'){ui.joinCode=el.value.toUpperCase().replace(/[^A-Z0-9]/g,'');el.value=ui.joinCode}
});
if(ui.screen==='home'&&!S.lang)ui.screen='lang';
render();
})();
</script>
</body>
</html>
